<main class="variant-stage">
  <div class="variant-inner">
    <div class="form-shell">
  <h1 class="fs-2xl fw-bold mb-1" style="letter-spacing:-.02em">Book an appointment</h1>
  <p class="fg-2 mb-6">Same-week slots, cancel free up to 24 hours before.</p>
  <form class="vstack gap-5" data-demo-form data-bs-validate novalidate>
    <div>
      <label class="form-label">Service</label>
      <button class="form-control combobox-toggle" type="button" data-bs-toggle="combobox" data-bs-search="true" data-bs-name="service" data-bs-placeholder="Choose a service…">
      <span class="combobox-value">Choose a service…</span>
      <svg class="combobox-caret" width="10" height="16" viewBox="0 0 10 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M0.46967 5.46967C0.762563 5.17678 1.23744 5.17678 1.53033 5.46967L5 8.93934L8.46967 5.46967C8.76256 5.17678 9.23744 5.17678 9.53033 5.46967C9.82322 5.76256 9.82322 6.23744 9.53033 6.53033L5.53033 10.5303C5.23744 10.8232 4.76256 10.8232 4.46967 10.5303L0.46967 6.53033C0.176777 6.23744 0.176777 5.76256 0.46967 5.46967Z" fill="currentcolor"/></svg>
    </button>
    <div class="menu">
      <button class="menu-item" type="button" data-bs-value="con">Consultation — 30 min</button>
      <button class="menu-item" type="button" data-bs-value="rev">Review — 45 min</button>
      <button class="menu-item" type="button" data-bs-value="full">Full assessment — 90 min</button>
    </div>
    </div>
    <div class="form-field">
      <label class="form-label" for="s5date">Date</label>
      <input type="text" class="form-control" id="s5date" data-bs-toggle="datepicker" autocomplete="off" placeholder="Choose a date…" required>
      <div class="invalid-feedback">Please pick a date.</div>
    </div>
    <div>
      <label class="form-label d-block">Available times</label>
      <div class="slots">
        <label class="btn-check btn-outline theme-primary btn-sm"><input type="radio" name="slot"> 09:20</label>
        <label class="btn-check btn-outline theme-primary btn-sm"><input type="radio" name="slot" checked> 10:40</label>
        <label class="btn-check btn-outline theme-primary btn-sm"><input type="radio" name="slot"> 13:15</label>
        <label class="btn-check btn-outline theme-primary btn-sm"><input type="radio" name="slot"> 16:30</label>
      </div>
    </div>
    <div class="form-field">
      <div class="switch"><input type="checkbox" value="" id="s5remind" role="switch" switch checked></div>
      <label for="s5remind">Text me a reminder the day before</label>
    </div>
    <div><button class="btn-solid theme-primary w-100 btn-lg" type="submit" data-done-text="Booked &#10003;">Confirm booking</button></div>
  </form>
</div>
  </div>
